name: Refresh GitHub docs snapshots

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  # Library repositories send this on push to main, so docs do not wait for the throttled cron.
  repository_dispatch:
    types: [docs-updated]
  push:
    branches: [main]
    paths:
      [
        "src/routes/docs/-utils/libraries.ts",
        "docs/type-contexts/**",
        "scripts/docs/**",
        "scripts/generate-doc-sources.mjs",
        "source.config.ts",
        "src/routes/docs/-components/mdx.tsx",
        "src/routes/docs/-utils/snapshot.ts",
        "package.json",
        "pnpm-lock.yaml",
        ".github/workflows/refresh-docs.yml",
      ]
  pull_request:
    paths:
      [
        "src/routes/docs/-utils/libraries.ts",
        "docs/type-contexts/**",
        "scripts/docs/**",
        "scripts/generate-doc-sources.mjs",
        "source.config.ts",
        "src/routes/docs/-components/mdx.tsx",
        "src/routes/docs/-utils/snapshot.ts",
        "package.json",
        "pnpm-lock.yaml",
        ".github/workflows/refresh-docs.yml",
      ]

concurrency:
  group: docs-snapshots-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # R2's S3-compatible API. Pull requests without these secrets build everything from scratch.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: jfdevelops-docs
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Read published pointers from R2
        shell: bash
        run: |
          mkdir -p .docs-snapshots
          if [ -n "$AWS_ACCESS_KEY_ID" ]; then
            aws s3 sync "s3://$R2_BUCKET" .docs-snapshots --endpoint-url "$R2_ENDPOINT"               --exclude '*' --include '*/current.json' --only-show-errors
          fi
      - id: changes
        run: node scripts/docs/check-updates.mjs
      - run: pnpm docs:snapshot
        if: steps.changes.outputs.changed == 'true'
      - run: pnpm exec vitest run scripts/docs/hover-contract.test.js
        if: steps.changes.outputs.changed == 'true'
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          name: docs-snapshots
          path: .docs-snapshots
          include-hidden-files: true
      - name: Publish snapshots to R2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          # Snapshot files are immutable and addressed by revision, so upload them first.
          aws s3 sync .docs-snapshots "s3://$R2_BUCKET" --endpoint-url "$R2_ENDPOINT"             --exclude '*/current.json' --content-type application/json --only-show-errors
          # Pointers go last: the site reads them on every request, so each one is live once written.
          for pointer in .docs-snapshots/*/current.json; do
            aws s3 cp "$pointer" "s3://$R2_BUCKET/${pointer#.docs-snapshots/}" --endpoint-url "$R2_ENDPOINT"               --content-type application/json --cache-control no-store --only-show-errors
          done
